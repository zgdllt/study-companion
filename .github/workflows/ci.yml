name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run regression suites
        run: npm test
      - name: Verify installable package
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/study-companion-package"
          tar -xzf "$RUNNER_TEMP/local-study-companion-1.0.0.tgz" --strip-components=1 -C "$RUNNER_TEMP/study-companion-package"
          npm --prefix "$RUNNER_TEMP/study-companion-package" run check
          npm --prefix "$RUNNER_TEMP/study-companion-package" test
